# ============================================================
# CATPPUCCIN MOCHA — LOADED / SUPERUSER STARSHIP
# ============================================================
# Two-line prompt. Left side shows everything relevant about
# where you are and what's active; right side shows system
# vitals (time, battery, memory, shell level). Nothing is
# hidden — if a module has something to say, it says it.

"$schema" = 'https://starship.rs/config-schema.json'

# ------------------------------------------------------------
# LAYOUT
# ------------------------------------------------------------

format = """
[┌─>](bold overlay0)$memory_usage$battery$jobs$cmd_duration
[│](bold overlay0)$username$hostname$localip$shlvl$singularity$kubernetes$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$pijul_channel$docker_context$package$nodejs$c$cpp$rust$golang$php$java$kotlin$haskell$scala$elixir$elm$erlang$gleam$lua$ruby$swift$zig$dart$dotnet$deno$bun$julia$crystal$purescript$vlang$nim$conda$pixi$meson$cmake$daml$terraform$vagrant$aws$gcloud$azure$openstack$direnv$env_var$crystal$custom$sudo
[└─](bold overlay0)$time$status$character"""

right_format = ""
add_newline = true
command_timeout = 500
scan_timeout = 30

palette = "high_contrast"

[palettes.high_contrast]
rosewater = "#ffd1dc"
flamingo  = "#ff8fa3"
pink      = "#ff2fb0"
mauve     = "#c724ff"
red       = "#ff0055"
maroon    = "#ff3860"
peach     = "#ff8800"
yellow    = "#ffe600"
green     = "#00ff9c"
teal      = "#00ffcc"
sky       = "#3ee6ff"
sapphire  = "#00d4ff"
blue      = "#0090ff"
lavender  = "#8f6fff"
text      = "#ffffff"
subtext1  = "#e6e6e6"
subtext0  = "#cccccc"
overlay1  = "#999999"
overlay0  = "#666666"
surface1  = "#333333"
surface0  = "#1a1a1a"
base      = "#000000"

# ------------------------------------------------------------
# PRIVILEGE / IDENTITY — always visible, not just over SSH
# ------------------------------------------------------------

[sudo]
disabled = false
symbol = "\uf21b "
format = "[$symbol]($style)"
style = "bold red"

[username]
show_always = true
style_user = "bold sapphire"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "bold overlay1"

[localip]
ssh_only = true
format = "[$localipv4]($style) "
style = "bold sapphire"

[shlvl]
disabled = false
threshold = 2
symbol = "\uf489 "
format = "[$symbol$shlvl]($style) "
style = "bold yellow"

# ------------------------------------------------------------
# DIRECTORY — full path, no truncation, deep repo awareness
# ------------------------------------------------------------

[directory]
style = "bold peach"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 8
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "\ue617"
read_only = "\uf023 "
read_only_style = "red"

[directory.substitutions]
"Documents" = "\ue6ad "
"Downloads" = "󰉍 "

# ------------------------------------------------------------
# VERSION CONTROL — everything on, full metrics
# ------------------------------------------------------------

[vcsh]
format = "[$symbol$repo]($style) "
style = "bold yellow"

[git_branch]
symbol = "\ue725 "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold mauve"

[git_commit]
commit_hash_length = 7
format = "[\\($hash$tag\\)]($style) "
style = "bold teal"
tag_symbol = " \uf02b "

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold peach"

[git_metrics]
disabled = false
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
added_style = "bold green"
deleted_style = "bold red"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "bold peach"
conflicted = "\uf071 ${count}"
ahead = "\uf062${count}"
behind = "\uf063${count}"
diverged = "\uf0ec${count}"
up_to_date = ""
untracked = "\uf128${count}"
stashed = "\uf01c${count}"
modified = "\uf040${count}"
staged = "\uf055${count}"
renamed = "\uf044${count}"
deleted = "\uf1f8${count}"

# ------------------------------------------------------------
# CONTAINERS / ORCHESTRATION / INFRA
# ------------------------------------------------------------

[docker_context]
symbol = "\uf308 "
format = "[$symbol$context]($style) "
style = "bold sapphire"
only_with_files = false

[kubernetes]
disabled = false
symbol = "\ue81d "
format = "[$symbol$context( \\($namespace\\))]($style) "
style = "bold sapphire"

[terraform]
symbol = "\ue8bd "
format = "[$symbol$workspace]($style) "
style = "bold mauve"

[vagrant]
symbol = "\ue8d0 "
format = "[$symbol$version]($style) "
style = "bold blue"

[aws]
symbol = "\ue7ad "
format = '[$symbol$profile( \($region\))( \[$duration\])]($style) '
style = "bold peach"
disabled = false

[gcloud]
symbol = "\uf0c2 "
format = '[$symbol$account(@$domain)(\($region\))]($style) '
style = "bold sapphire"
disabled = false

[azure]
symbol = "\ue754 "
format = "[$symbol($subscription)]($style) "
style = "bold blue"
disabled = false

[openstack]
symbol = "\ue856 "
format = "[$symbol$cloud(\\($project\\))]($style) "
style = "bold yellow"

[direnv]
disabled = false
symbol = "\uf084 "
format = "[$symbol$loaded/$allowed]($style) "
style = "bold green"

# ------------------------------------------------------------
# LANGUAGES / RUNTIMES — nearly all enabled, version shown
# ------------------------------------------------------------

[package]
symbol = "\uf487 "
format = "[$symbol$version]($style) "
style = "bold teal"

[nodejs]
symbol = "\ued0d "
format = "[$symbol$version]($style) "
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = "\ued1b "
format = '[$symbol$version(\($virtualenv\))]($style) '
style = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", "setup.py", ".python-version"]

[rust]
symbol = "\ue7a8 "
format = "[$symbol$version]($style) "
style = "bold peach"

[golang]
symbol = "\ue627 "
format = "[$symbol$version]($style) "
style = "bold sapphire"

[php]
symbol = "\ue73d "
format = "[$symbol$version]($style) "
style = "bold mauve"

[java]
symbol = "\uedaf "
format = "[$symbol$version]($style) "
style = "bold red"

[kotlin]
symbol = "\ue81b "
format = "[$symbol$version]($style) "
style = "bold blue"

[haskell]
symbol = "\ue777 "
format = "[$symbol$version]($style) "
style = "bold maroon"

[scala]
symbol = "e737 "
format = "[$symbol$version]($style) "
style = "bold red"

[elixir]
symbol = "\ue62d "
format = "[$symbol$version \\(OTP $otp_version\\)]($style) "
style = "bold mauve"

[elm]
symbol = "\ue62c "
format = "[$symbol$version]($style) "
style = "bold sapphire"

[erlang]
symbol = "\ue7b1 "
format = "[$symbol$version]($style) "
style = "bold red"

[gleam]
symbol = "\ue914 "
format = "[$symbol$version]($style) "
style = "bold pink"

[lua]
symbol = "\ue826 "
format = "[$symbol$version]($style) "
style = "bold blue"

[ruby]
symbol = "\ue739 "
format = "[$symbol$version]($style) "
style = "bold red"

[swift]
symbol = "\ue755 "
format = "[$symbol$version]($style) "
style = "bold peach"

[zig]
symbol = "\ue8ef "
format = "[$symbol$version]($style) "
style = "bold yellow"

[dart]
symbol = "\ue798 "
format = "[$symbol$version]($style) "
style = "bold sapphire"

[dotnet]
symbol = ".NET "
format = "[$symbol$version]($style) "
style = "bold mauve"

[deno]
symbol = "\ue7c0 "
format = "[$symbol$version]($style) "
style = "bold green"

[bun]
symbol = "\ue76f "
format = "[$symbol$version]($style) "
style = "bold yellow"

[julia]
symbol = "\ue80d "
format = "[$symbol$version]($style) "
style = "bold peach"

[crystal]
symbol = "\ue7ac "
format = "[$symbol$version]($style) "
style = "bold text"

[purescript]
symbol = "\ue875 "
format = "[$symbol$version]($style) "
style = "bold sky"

[vlang]
symbol = "V "
format = "[$symbol$version]($style) "
style = "bold blue"

[nim]
symbol = "\ue841 "
format = "[$symbol$version]($style) "
style = "bold yellow"

[c]
symbol = "\ue771 "
format = "[$symbol$version]($style) "
style = "bold blue"

[cpp]
symbol = "\ue646 "
format = "[$symbol$version]($style) "
style = "bold blue"

[cmake]
symbol = "\ue794 "
format = "[$symbol$version]($style) "
style = "bold overlay1"

[meson]
symbol = "⬢ "
format = "[$symbol$project]($style) "
style = "bold overlay1"

[conda]
symbol = "🅒 "
format = "[$symbol$environment]($style) "
style = "bold green"

[pixi]
symbol = "🧚 "
format = "[$symbol$version \\($environment\\)]($style) "
style = "bold pink"

[daml]
symbol = "Λ "
format = "[$symbol$version]($style) "
style = "bold sapphire"

[env_var]
variable = "ENV"
default = ""
format = "[$env_value]($style) "
style = "bold overlay1"

# ------------------------------------------------------------
# RIGHT-BLOCK: SYSTEM VITALS (rendered on the second line)
# ------------------------------------------------------------

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[\uf017 $time]($style) "
style = "bold subtext0"

[memory_usage]
disabled = false
threshold = 0
symbol = "\uefc5 "
format = "[$symbol${ram}( | ${swap})]($style) "
style = "bold teal"

[battery]
disabled = false
[[battery.display]]
threshold = 100
style = "bold green"
[[battery.display]]
threshold = 50
style = "bold yellow"
[[battery.display]]
threshold = 15
style = "bold red"

[jobs]
symbol = "✦ "
format = "[$symbol$number]($style) "
style = "bold mauve"
number_threshold = 1

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[\uf43a $duration]($style) "
style = "bold overlay1"

[status]
disabled = false
format = "[\uebfb $status]($style) "
style = "bold red"
map_symbol = true
pipestatus = true

# ------------------------------------------------------------
# PROMPT CHARACTER
# ------------------------------------------------------------

[character]
success_symbol = "[❯❯](bold green)"
error_symbol = "[❯❯](bold red)"
vimcmd_symbol = "[❮❮](bold mauve)"